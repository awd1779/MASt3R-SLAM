# config/semantic_slam.yaml
inherit: "config/base.yaml"
verbose: true

semantic_segmentation:
  enabled: true
  
  # Mock mode removed - always uses real Grounded-SAM2
  
  # Perception front-end choice for experiments
  # Options: "grounded_sam" (proposed), "sam_clip" (baseline)
  frontend_type: "grounded_sam"

  # Grounded-SAM2 settings
  grounded_sam2:
    model_type: "hiera_b+"
    grounding_model: "grounding_dino_swin-b"
    device: "cuda:0"
    confidence_threshold: 0.35
    dtype: "float32"  # Options: "float32", "float16", "bfloat16" - float32 for maximum compatibility
    
    # Debug and evaluation settings
    debug_mode: false  # Enable verbose logging and debug visualizations
    save_debug_visualizations: false  # Save detection/mask visualizations
    deduplication_iou_threshold: 0.9  # IoU threshold for removing duplicate detections
    mask_refinement_threshold: 0.7  # Refine box if mask occupies less than this ratio
  
  # Initial Vocabulary (can be updated dynamically via API)
  initial_vocabulary: ["monitor", "chair", "table", "bottle", "container", "headset", "bag", "rubbish bin", "laptop", "floor", "coffee cup", "mouse" ]
     
  # Backend settings
  backend:
    enable_semantic_verification: true
    enable_semantic_factor: false
    semantic_weight: 0.05

